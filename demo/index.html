<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela Secure – Testversion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a12;--panel:#15131f;--panel2:#1d1a2a;--panel3:#252136;--line:#2c2840;--txt:#ece9f5;--mut:#9a94b3;
  --tor:#7d4698;--tor2:#a86fd0;--ok:#3ecf8e;--warn:#f5b041;--bad:#ef5b5b;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--txt);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
code{font-family:var(--mono);background:#ffffff10;padding:1px 5px;border-radius:4px;font-size:.92em}

/* ---------- Boot ---------- */
#rainbow{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f)}
#bootlog{background:#000;flex-direction:column;padding:18px 22px;font:13px/1.55 var(--mono);color:#cfcfcf;overflow:hidden}
#bootlog .ok{color:#3ecf8e}#bootlog .vl{color:var(--tor2)}#bootlog .w{color:var(--warn)}
#splash{background:radial-gradient(1000px 600px at 50% 40%,#1b1230,#07060c);flex-direction:column;align-items:center;justify-content:center;gap:26px}
#off{background:#000;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#666;font-size:14px;cursor:pointer}
.logo{display:flex;align-items:center;gap:14px}
.logo h1{font-size:40px;font-weight:700;letter-spacing:.14em}
.logo small{display:block;font-size:12px;letter-spacing:.32em;color:var(--tor2);font-weight:600;margin-top:2px}
.bar{width:min(380px,80vw);height:5px;background:#241f36;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tor),var(--tor2));transition:width .3s}

/* ---------- Desktop ---------- */
#desktop{flex-direction:column}
#wall{position:absolute;inset:0;z-index:0;transition:background .5s}
#topbar{position:relative;z-index:5000;height:32px;display:flex;align-items:center;gap:4px;padding:0 6px;background:#0d0a16e8;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff0d;font-size:13px}
#topbar .tb{height:26px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;color:var(--txt)}
#topbar .tb:hover,#topbar .tb.open{background:#ffffff14}
#vmenu{font-weight:700;color:#c49ae8}
#atitle{color:var(--mut);margin-left:6px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
#topbar .sp{flex:1}
#clock{font-weight:500}
.tordot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.tordot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#area{position:relative;flex:1;z-index:1;overflow:hidden}
#icons{position:absolute;top:14px;left:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);gap:6px;height:calc(100% - 100px)}
.dicon{width:84px;height:90px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;border-radius:10px;font-size:12px;text-align:center;color:#fff;text-shadow:0 1px 3px #000}
.dicon:hover{background:#ffffff14}.dicon.sel{background:#7d469855}
.appico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 14px #0006;flex:none;color:#fff;font-weight:700}
.appico.s{width:22px;height:22px;border-radius:6px;font-size:12px;box-shadow:none}
.appico.m{width:34px;height:34px;border-radius:9px;font-size:18px}

/* Dock */
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4000;display:flex;gap:6px;padding:7px 9px;background:#15111fd9;backdrop-filter:blur(14px);border:1px solid #ffffff12;border-radius:16px}
.dk{position:relative;display:grid;place-items:center;border-radius:12px;transition:transform .15s}
.dk:hover{transform:translateY(-4px)}
.dk::after{content:"";position:absolute;bottom:-5px;width:4px;height:4px;border-radius:50%;background:transparent}
.dk.run::after{background:var(--tor2)}
.dk .tip{position:absolute;bottom:58px;background:var(--panel2);border:1px solid var(--line);padding:4px 9px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s}
.dk:hover .tip{opacity:1}
.dsep{width:1px;background:#ffffff1a;margin:6px 3px}

/* Windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid #ffffff17;border-radius:11px;box-shadow:0 24px 60px #000b,0 0 0 1px #0006;overflow:hidden;min-width:260px;min-height:160px;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.win.focus{border-color:#a86fd055}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 78px)!important;border-radius:0}
.win.min{display:none}
.wt{height:36px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 11px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:default;touch-action:none}
.wt .wn{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt button{width:28px;height:24px;border-radius:6px;color:var(--mut);font-size:13px}
.wt button:hover{background:#ffffff14;color:var(--txt)}
.wt button.x:hover{background:var(--bad);color:#fff}
.wbody{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.rz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;z-index:5}

/* Popups/Menu */
.pop{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px #000a;padding:12px;display:none;z-index:6000}
.pop.on{display:block}
#startmenu{top:38px;left:6px;width:360px;max-width:calc(100vw - 12px)}
#startmenu input{width:100%;background:#0d0b14;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--txt);outline:0;font-size:14px}
#startmenu input:focus{border-color:var(--tor2)}
.mlist{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-size:13px;text-align:left}
.mi:hover{background:#ffffff10}
.mfoot{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mfoot button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;background:var(--panel3)}
.mfoot button:hover{background:#7d469855}
#trayPop{top:38px;right:6px;width:300px}
.ctx{position:absolute;z-index:7000;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px;min-width:190px;box-shadow:0 14px 40px #000a}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.ctx button:hover{background:#7d469855}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#notes{position:absolute;top:40px;right:10px;z-index:6500;display:flex;flex-direction:column;gap:8px;width:300px;pointer-events:none}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--tor2);border-radius:9px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px #0008;animation:slide .25s ease-out}
.note b{display:block;margin-bottom:2px}.note span{color:var(--mut);font-size:12.5px}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

/* common UI */
.btn{background:var(--tor);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn.g{background:var(--panel3);border:1px solid var(--line);color:var(--txt);font-weight:500}
.btn:hover{filter:brightness(1.15)}
.tag{font:600 10.5px var(--mono);padding:3px 7px;border-radius:5px;white-space:nowrap}
.tag.ok{background:#3ecf8e22;color:var(--ok)}.tag.bad{background:#ef5b5b22;color:var(--bad)}.tag.w{background:#f5b04122;color:var(--warn)}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border:0}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tool{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel2);border-bottom:1px solid var(--line);flex:none}
.tool .ib,.ib{height:28px;min-width:28px;padding:0 8px;border-radius:6px;display:grid;place-items:center;color:var(--mut);font-size:13px}
.tool .ib:hover,.ib:hover{background:#ffffff12;color:var(--txt)}
.fwlog{font:11.5px/1.6 var(--mono);background:#07060b;border:1px solid var(--line);border-radius:9px;padding:10px;height:170px;overflow:auto;color:#bbb}
.fwlog .d{color:var(--bad)}

/* Browser app */
.b-tabs{display:flex;align-items:flex-end;gap:3px;padding:5px 6px 0;background:#0f0d17;height:36px;flex:none}
.b-tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 11px;height:31px;min-width:90px;max-width:200px;flex:0 1 180px;border-radius:7px 7px 0 0;color:var(--mut);font-size:12.5px;cursor:pointer}
.b-tab.act{background:var(--panel);color:var(--txt)}
.b-tab span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-tab b{font-weight:400;opacity:.6;padding:1px 4px;border-radius:4px}.b-tab b:hover{background:#ffffff1a;opacity:1}
.b-nav{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.b-url{flex:1;display:flex;align-items:center;gap:8px;background:#0d0b14;border:1px solid var(--line);border-radius:8px;height:32px;padding:0 6px 0 4px;min-width:0}
.b-url:focus-within{border-color:var(--tor2)}
.b-url input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:13.5px var(--sans)}
.circ{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--tor2);background:#7d46982a;white-space:nowrap}
.circ:hover{background:#7d469855}
.b-content{flex:1;overflow:auto;background:#100e18;position:relative}
.page{max-width:780px;margin:0 auto;padding:44px 22px 50px}
.home{text-align:center;padding-top:6vh}
.home h2{font-size:26px;font-weight:600;margin:14px 0 6px}.home p{color:var(--mut);font-size:14px}
.search{margin:24px auto 0;max-width:520px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.search input{flex:1;padding:12px 14px;background:none;border:0;outline:0;color:var(--txt);font-size:14px;min-width:0}
.search button{padding:0 16px;background:var(--tor);color:#fff;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:30px;text-align:left}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--tor2);transform:translateY(-2px)}
.card h4{font-size:13.5px;margin-bottom:4px}.card p{font-size:12px;color:var(--mut);line-height:1.45}.card .ic{font-size:19px;margin-bottom:6px}
h2.t{font-size:23px;margin-bottom:6px}.sub{color:var(--mut);margin-bottom:22px;font-size:14px}
.fake{border:1px dashed var(--line);border-radius:11px;padding:16px;color:var(--mut);font-size:13.5px;line-height:1.6}
.bpop{position:absolute;top:76px;width:300px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 50px #000a;padding:14px;display:none;z-index:20}
.bpop.on{display:block}.bpop h5{font-size:13px;margin-bottom:10px}
.hop{display:flex;align-items:center;gap:10px;position:relative;padding:6px 0 6px 4px;font-size:12.5px}
.hop i{width:11px;height:11px;border-radius:50%;border:2px solid var(--tor2);background:var(--panel2);z-index:1;flex:none}
.hop:not(:last-child)::after{content:"";position:absolute;left:9px;top:20px;height:22px;border-left:2px solid #7d469877}
.hop small{color:var(--mut);font:10.5px var(--mono);margin-left:auto}
.lvl button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel3);border-radius:9px;padding:10px 12px;margin-bottom:6px}
.lvl button.on{border-color:var(--tor2);background:#7d46982e}
.lvl b{display:block;font-size:13px;margin-bottom:2px}.lvl span{font-size:11.5px;color:var(--mut)}

/* Files */
.f-wrap{flex:1;display:flex;min-height:0}
.f-side{width:170px;flex:none;background:#12101b;border-right:1px solid var(--line);padding:8px;overflow:auto}
.f-side button{display:flex;gap:8px;width:100%;padding:7px 9px;border-radius:7px;font-size:13px;text-align:left}
.f-side button:hover{background:#ffffff0d}.f-side button.on{background:#7d469844}
.f-main{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));align-content:start;gap:6px}
.f-it{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:9px;font-size:12px;text-align:center;word-break:break-word;cursor:default}
.f-it:hover{background:#ffffff0d}.f-it.sel{background:#7d469855}
.f-it .fi{font-size:34px;line-height:1}
.f-path{flex:1;font:12.5px var(--mono);color:var(--mut);background:#0d0b14;border:1px solid var(--line);border-radius:7px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-empty{grid-column:1/-1;color:var(--mut);font-size:13px;text-align:center;padding:40px}
.f-in{background:#0d0b14;border:1px solid var(--tor2);border-radius:6px;color:var(--txt);padding:4px 8px;font-size:13px;outline:0;width:160px}

/* Terminal */
.term{flex:1;background:#0c0a12;font:13px/1.5 var(--mono);color:#ddd;padding:10px 12px;overflow:auto;user-select:text;-webkit-user-select:text}
.term .p{color:var(--tor2)}.term .g{color:var(--ok)}.term .r{color:var(--bad)}.term .y{color:var(--warn)}.term .m{color:var(--mut)}
.term .line{display:flex;gap:8px}.term input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--tor2)}
.term pre{font:inherit;white-space:pre-wrap}

/* Editor */
.ed{flex:1;background:#0f0d16;border:0;outline:0;color:var(--txt);font:13.5px/1.6 var(--mono);padding:14px;resize:none}
/* Calc */
.calc{flex:1;display:flex;flex-direction:column;padding:12px;gap:10px;background:#100e18}
.cdisp{background:#0b0a10;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:right}
.cdisp small{display:block;color:var(--mut);font:12px var(--mono);min-height:16px}
.cdisp div{font:600 28px var(--mono);overflow:hidden;text-overflow:ellipsis}
.ckeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ckeys button{background:var(--panel3);border-radius:9px;font-size:17px;font-weight:500}
.ckeys button:hover{filter:brightness(1.25)}.ckeys .op{background:#7d469866}.ckeys .eq{background:var(--tor);color:#fff}
/* Settings */
.s-wrap{flex:1;display:flex;min-height:0}
.s-side{width:190px;flex:none;background:#12101b;border-right:1px solid var(--line);padding:8px;overflow:auto}
.s-side button{display:flex;gap:9px;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;text-align:left}
.s-side button:hover{background:#ffffff0d}.s-side button.on{background:#7d469844}
.s-main{flex:1;overflow:auto;padding:20px 22px}
.s-main h3{font-size:19px;margin-bottom:4px}.s-main .sub{margin-bottom:16px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.walls button{height:80px;border-radius:10px;border:2px solid transparent}.walls button.on{border-color:var(--tor2)}
select{background:#0d0b14;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 8px;font:13px var(--sans)}
/* Monitor */
.mon{flex:1;overflow:auto;padding:16px;background:#100e18}
.cpus{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cpu{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;color:var(--mut)}
.cpu .mb{height:6px;background:#241f36;border-radius:9px;margin-top:8px;overflow:hidden}.cpu .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--tor),var(--tor2));transition:width .6s}
.cpu b{display:block;color:var(--txt);font-size:18px;font-family:var(--mono);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #ffffff08;font-family:var(--mono)}
.imgv{flex:1;display:grid;place-items:center;background:#08070c}

.demo-note{position:fixed;left:12px;bottom:14px;font-size:11px;color:#9a94b377;z-index:4500;pointer-events:none}
@media (max-width:700px){.f-side,.s-side{width:120px}.cpus{grid-template-columns:1fr 1fr}#atitle{display:none}.demo-note{display:none}.circ .lbl{display:none}}
</style>
</head>
<body>

<div id="rainbow" class="screen on"></div>
<div id="bootlog" class="screen"></div>
<div id="splash" class="screen">
  <div class="logo"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="34" r="26" fill="none" stroke="#a86fd0" stroke-width="4"/><circle cx="32" cy="34" r="17" fill="none" stroke="#8a52b4" stroke-width="4"/><circle cx="32" cy="34" r="8" fill="#7d4698"/><path d="M32 8c3-4 7-5 10-4" stroke="#a86fd0" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <div><h1>VELA</h1><small>SECURE · TOR EDITION</small></div></div>
  <div class="bar"><i id="spbar"></i></div>
</div>
<div id="off" class="screen"><div>Vela wurde heruntergefahren.</div><div style="font-size:12px">Zum Einschalten klicken</div></div>

<div id="desktop" class="screen">
  <div id="wall"></div>
  <div id="topbar">
    <button class="tb" id="vmenu">◉ Vela</button>
    <span id="atitle"></span>
    <div class="sp"></div>
    <span id="clock"></span>
    <div class="sp"></div>
    <button class="tb" id="trayBtn"><span class="tordot" id="tordot"></span><span id="torLbl">Tor verbindet …</span><span>📶</span><span>🔊</span></button>
  </div>
  <div id="area">
    <div id="icons"></div>
    <div id="wins"></div>
    <div id="dock"></div>
    <div id="notes"></div>
  </div>
  <div class="pop" id="startmenu">
    <input id="msearch" placeholder="Programme suchen …">
    <div class="mlist" id="mlist"></div>
    <div class="mfoot"><button id="mLock">🔄 Neu starten</button><button id="mOff">⏻ Ausschalten</button></div>
  </div>
  <div class="pop" id="trayPop"></div>
</div>
<div class="demo-note">Testversion im Browser – simuliert, keine echte Tor-Verbindung · Esc überspringt den Start</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const show=id=>$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
let skip=false;document.addEventListener('keydown',e=>{if(e.key==='Escape')skip=true});
const store={get(k,d){try{const v=localStorage.getItem('vela.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('vela.'+k,JSON.stringify(v))}catch(e){}}};

/* ================= System-Zustand ================= */
const WALLS=[
 'radial-gradient(1200px 700px at 70% 20%,#3b1d5e 0%,transparent 60%),radial-gradient(900px 600px at 10% 90%,#1d2a5e 0%,transparent 60%),#0c0914',
 'radial-gradient(1000px 700px at 30% 30%,#0f4a4a 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#2a1450 0%,transparent 60%),#070b10',
 'linear-gradient(160deg,#2b0f33 0%,#120a1f 45%,#06040a 100%)',
 'radial-gradient(900px 600px at 50% 110%,#7d4698 0%,transparent 60%),linear-gradient(#0a0812,#130d22)',
];
const SYS={tor:false,fwBlocked:0,fwLog:[],level:0,wall:store.get('wall',0),bridge:'Keine',
  wifi:'FRITZ!Box 7590 XY',mac:'',boot:Date.now()};

function norm(p,cwd=HOME){if(p.startsWith('~'))p=HOME+p.slice(1);if(!p.startsWith('/'))p=cwd+'/'+p;

function node(p){p=norm(p);if(p===HOME)return FS;if(!p.startsWith(HOME+'/'))return SYSFILES[p]||null;
  let n=FS;for(const s of p.slice(HOME.length+1).split('/')){if(!n||n.t!=='d')return null;n=n.c[s]}return n||null}
function parentOf(p){p=norm(p);const i=p.lastIndexOf('/');return [p.slice(0,i)||'/',p.slice(i+1)]}

  win.setTitle=t=>{win.title=t;$('.wn',el).textContent=t;if(WM.focus===win)$('#atitle').textContent=t};
  win.close=()=>{win.cleanup.forEach(f=>f());el.remove();WM.wins=WM.wins.filter(x=>x!==win);if(WM.focus===win){WM.focus=null;const top=WM.wins.filter(w=>!w.el.classList.contains('min')).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];top?focus(top):$('#atitle').textContent=''}renderDock()};

function drag(handle,el,move){handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();
  const s={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};handle.setPointerCapture(e.pointerId);
  const mv=ev=>move(ev.clientX-s.x,ev.clientY-s.y,s);const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up)};
  handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up)})}
function focus(w){if(WM.focus===w&&+w.el.style.zIndex===WM.z)return;WM.wins.forEach(x=>x.el.classList.remove('focus'));w.el.style.zIndex=++WM.z;w.el.classList.add('focus');WM.focus=w;$('#atitle').textContent=w.title;renderDock()}

  const d=$('#dock');d.innerHTML='';
  const extra=WM.wins.map(w=>w.app).filter((a,i,arr)=>!DOCK.includes(a)&&arr.indexOf(a)===i);
  [...DOCK,...(extra.length?['|',...extra]:[])].forEach(id=>{
    if(id==='|'){const s=document.createElement('div');s.className='dsep';d.appendChild(s);return}
    const run=WM.wins.filter(w=>w.app===id);const b=document.createElement('button');b.className='dk'+(run.length?' run':'');
    b.innerHTML=ico(id)+`<span class="tip">${APPS[id].name}</span>`;

      if(w.el.classList.contains('min'))restore(w);else if(WM.focus===w&&run.length===1){w.el.classList.add('min');WM.focus=null;$('#atitle').textContent='';renderDock()}else focus(w)};

}

  let path=typeof arg==='string'?arg:null,dirty=false;const b=win.body;
  b.innerHTML=`<div class="tool"><button class="ib" data-a="new">📄 Neu</button><button class="ib" data-a="save">💾 Speichern</button><span class="nm" style="flex:1;color:var(--mut);font-size:12.5px;margin-left:6px"></span><span class="ro tag w" style="display:none">SCHREIBGESCHÜTZT</span></div><textarea class="ed" spellcheck="false"></textarea>`;
  const ta=$('textarea',b);
  const ro=()=>path&&!path.startsWith(HOME+'/');
  function load(){const n=path?node(path):null;ta.value=n?n.v||'':'';dirty=false;upd()}
  function upd(){const nm=path?path.split('/').pop():'Unbenannt';win.setTitle((dirty?'● ':'')+nm+' — Texteditor');$('.nm',b).textContent=path||'Neue Datei (wird in ~/Dokumente gespeichert)';$('.ro',b).style.display=ro()?'':'none';ta.readOnly=ro()}
  function save(){if(ro())return notify('⛔ Schreibgeschützt','Systemdateien kann nur root ändern.');
    if(!path){let i=1;while(node(HOME+'/Dokumente/Dokument '+i+'.txt'))i++;path=HOME+'/Dokumente/Dokument '+i+'.txt'}
    writeFile(path,ta.value);dirty=false;upd();notify('💾 Gespeichert',path.replace(HOME,'~'))}
  ta.oninput=()=>{if(!dirty){dirty=true;upd()}};
  ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}};
  $('[data-a="save"]',b).onclick=save;$('[data-a="new"]',b).onclick=()=>openApp('editor');
  load();setTimeout(()=>ta.focus(),50);
}

/* ================= App: Rechner ================= */
function initCalc(win){
  const b=win.body;b.innerHTML=`<div class="calc"><div class="cdisp"><small></small><div>0</div></div><div class="ckeys"></div></div>`;
  let expr='',res='0';const K=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='];
  const D=$('.cdisp div',b),S=$('.cdisp small',b);
  const upd=()=>{D.textContent=expr||res;S.textContent=expr?'':''};
  function calc(){try{const js=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');if(!/^[\d+\-*/().\s]+$/.test(js))throw 0;
    let r=Function('"use strict";return ('+js+')')();if(!isFinite(r))throw 0;r=Math.round(r*1e10)/1e10;S.textContent=expr+' =';res=String(r).replace('.',',');expr='';D.textContent=res}catch(e){D.textContent='Fehler';expr=''}}
  function press(k){if(k==='C'){expr='';res='0';S.textContent=''}else if(k==='='){calc();return}else if(k==='±'){expr=expr?'−('+expr+')':(res!=='0'?'−'+res:'')}
    else{if(!expr&&/[+−×÷]/.test(k)&&res!=='0')expr=res;expr+=k}D.textContent=expr||res}
  K.forEach(k=>{const x=document.createElement('button');x.textContent=k;if(/[÷×−+]/.test(k))x.className='op';if(k==='=')x.className='eq';x.onclick=()=>press(k);$('.ckeys',b).appendChild(x)});
  const kd=e=>{if(WM.focus!==win)return;const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'BS','Escape':'C',',':',','.':',','(':'(',')':')'};
    let k=/^\d$/.test(e.key)?e.key:m[e.key];if(!k)return;e.preventDefault();if(k==='BS'){expr=expr.slice(0,-1);D.textContent=expr||res;return}press(k)};
  document.addEventListener('keydown',kd);win.cleanup.push(()=>document.removeEventListener('keydown',kd));upd();
}

/* ================= App: Systemmonitor ================= */
function initMonitor(win){
  const b=win.body;b.innerHTML=`<div class="mon"><div class="cpus"></div><div class="box"><div class="row"><div>Arbeitsspeicher<small class="ram"></small></div><span class="tag ok">zram aktiv</span></div>
  <div class="row"><div>Netzwerk<small>Nur Tor (Benutzer debian-tor) darf Daten senden</small></div><span class="tag ok net"></span></div>
  <div class="row"><div>Temperatur<small>SoC BCM2837</small></div><span class="tag w temp"></span></div></div>
  <table><thead><tr><th>PID</th><th>Benutzer</th><th>CPU</th><th>RAM</th><th>Prozess</th></tr></thead><tbody></tbody></table></div>`;
  const P=[[1,'root','init'],[412,'debian-tor','tor'],[455,'root','systemd-networkd'],[470,'root','wpa_supplicant'],[498,'vela','labwc'],[521,'vela','waybar'],[604,'vela','firefox.real (Tor Browser)'],[640,'vela','bash']];
  const cp=$('.cpus',b);for(let i=0;i<4;i++)cp.innerHTML+=`<div class="cpu">Kern ${i+1}<b>0%</b><div class="mb"><i></i></div></div>`;
  function upd(){$$('.cpu',b).forEach(c=>{const v=Math.floor(5+Math.random()*(SYS.tor?45:80));$('b',c).textContent=v+'%';$('i',c).style.width=v+'%'});
    const ram=560+Math.floor(Math.random()*90);$('.ram',b).textContent=`${ram} MiB von 905 MiB benutzt · zram ${90+Math.floor(Math.random()*40)} MiB (zstd, ~3:1)`;
    $('.net',b).textContent=`↓ ${(Math.random()*180).toFixed(0)} KB/s über Tor`;$('.temp',b).textContent=(48+Math.random()*8).toFixed(1)+' °C';
    $('tbody',b).innerHTML=P.map(p=>{const c=p[2].startsWith('firefox')?(8+Math.random()*20):p[2]==='tor'?(1+Math.random()*4):Math.random()*1.5;const m=p[2].startsWith('firefox')?31:p[2]==='tor'?6.8:Math.random()*3;
      return `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${c.toFixed(1)}%</td><td>${m.toFixed(1)}%</td><td>${esc(p[2])}</td></tr>`}).join('')}
  upd();const t=setInterval(upd,1500);win.cleanup.push(()=>clearInterval(t));
}

/* ================= App: Einstellungen ================= */
function setWall(i){SYS.wall=i;store.set('wall',i);$('#wall').style.background=WALLS[i];emit('wall')}
function initSettings(win,arg){
  const b=win.body;let sec=typeof arg==='string'?arg:'network';
  const SEC=[['network','📶','Netzwerk'],['look','🎨','Darstellung'],['security','🛡️','Sicherheit'],['firewall','🧱','Firewall'],['tor','🧅','Tor'],['about','ℹ️','Über Vela']];
  b.innerHTML=`<div class="s-wrap"><div class="s-side"></div><div class="s-main"></div></div>`;
  const R=(n,s,t,c='ok')=>`<div class="row"><div>${n}<small>${s}</small></div><span class="tag ${c}">${t}</span></div>`;
  const NETS=[['FRITZ!Box 7590 XY',78,'WPA2'],['Vodafone-4G2A',54,'WPA2'],['Telekom-8B12',41,'WPA3'],['Gast-WLAN',33,'offen']];
  function render(){
    $('.s-side',b).innerHTML='';SEC.forEach(([k,i,n])=>{const x=document.createElement('button');x.className=k===sec?'on':'';x.innerHTML=`<span>${i}</span>${n}`;x.onclick=()=>{sec=k;render()};$('.s-side',b).appendChild(x)});
    const m=$('.s-main',b);win.setTitle('Einstellungen — '+SEC.find(s=>s[0]===sec)[2]);
    if(sec==='network'){m.innerHTML=`<h3>Netzwerk</h3><p class="sub">Vela sendet dem Router keinen Gerätenamen und benutzt eine zufällige MAC-Adresse.</p>
      <div class="box">${NETS.map(n=>`<div class="row"><div>${n[0]}<small>${n[2]} · Signal ${n[1]}%</small></div>${SYS.wifi===n[0]?'<button class="btn g" data-w="">Trennen</button>':`<button class="btn" data-w="${n[0]}">Verbinden</button>`}</div>`).join('')}</div>
      <div class="box">${R('MAC-Adresse',SYS.mac,'ZUFÄLLIG')}<div class="row"><div>Neue MAC-Adresse<small>Wechselt die Hardware-Adresse sofort</small></div><button class="btn g" data-mac>Neu erzeugen</button></div></div>
      <p class="sub" style="font-size:12.5px">Auf dem echten Pi wird das WLAN in <code>vela-wlan.txt</code> auf der SD-Karte eingetragen.</p>`;
      $$('[data-w]',m).forEach(x=>x.onclick=async()=>{const w=x.dataset.w;if(!w){SYS.wifi='';notify('📶 WLAN getrennt','');render();return}x.textContent='Verbinde …';await sleep(900);SYS.wifi=w;notify('📶 Verbunden',w+' · neue zufällige MAC');SYS.mac=randMac();render()});
      $('[data-mac]',m).onclick=()=>{SYS.mac=randMac();notify('🎭 Neue MAC-Adresse',SYS.mac);render()}}
    if(sec==='look'){m.innerHTML=`<h3>Darstellung</h3><p class="sub">Hintergrundbild auswählen</p><div class="walls">${WALLS.map((w,i)=>`<button data-i="${i}" class="${i===SYS.wall?'on':''}" style="background:${w}"></button>`).join('')}</div>`;
      $$('[data-i]',m).forEach(x=>x.onclick=()=>{setWall(+x.dataset.i);render()})}
    if(sec==='security'){m.innerHTML=`<h3>Sicherheit</h3><p class="sub">Alle Schutzfunktionen von Vela Secure</p>
      <div class="box">${R('Tor','System-Dienst, Stream-Isolation pro Webseite',SYS.tor?'VERBUNDEN':'VERBINDET',SYS.tor?'ok':'w')}${R('Killswitch-Firewall','Nur der Tor-Dienst darf ins Internet','AKTIV')}${R('DNS-Leck-Schutz','Webseitennamen werden nur über Tor aufgelöst','AKTIV')}${R('Tor Browser','Standardbrowser · Stufe: '+LV[SYS.level],'AKTIV')}</div>
      <div class="box">${R('SSH / Fernzugriff','Dienst maskiert, kein Port offen','AUS')}${R('Bluetooth','Kernelmodule gesperrt','AUS')}${R('Admin-Rechte','root gesperrt, kein sudo installiert','GESPERRT')}${R('AppArmor','Programme dürfen nur, was sie müssen','AKTIV')}${R('Kernel-Härtung','init_on_free, kptr_restrict, BPF aus, ptrace_scope=2','AKTIV')}${R('Logs','Nur im RAM, nach dem Ausschalten weg','FLÜCHTIG')}${R('Automatische Updates','Täglich über Tor','AN')}</div>`}
    if(sec==='firewall'){m.innerHTML=`<h3>Firewall & Killswitch</h3><p class="sub">Alles ist gesperrt, nur Tor darf ins Internet. Fällt die Firewall aus, startet Tor nicht.</p>
      <div class="box">${R('Eingehend','alles blockiert, außer Antworten auf eigene Verbindungen','DROP','bad')}${R('Ausgehend · debian-tor','der Tor-Dienst','ERLAUBT')}${R('Ausgehend · Uhrzeit (NTP)','Nötig, weil der Pi keine Batterie-Uhr hat','UDP 123','w')}${R('Ausgehend · alles andere','Apps, direkte Verbindungen, DNS ohne Tor','DROP','bad')}</div>
      <div class="box" style="padding:14px 16px"><b style="font-size:13.5px">Killswitch testen</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-t="d">Direkt zu google.com</button><button class="btn g" data-t="n">DNS an 8.8.8.8</button><button class="btn g" data-t="t">Über Tor</button></div><div class="tres" style="margin-top:10px;font-size:13.5px"></div></div>
      <b style="font-size:13.5px;display:block;margin:6px 0 8px">Live-Protokoll · <span class="cnt">${SYS.fwBlocked}</span> blockiert</b><div class="fwlog">${SYS.fwLog.join('<br>')||'<span style="color:#666">Noch nichts blockiert …</span>'}</div>`;
      const r=$('.tres',m);
      $$('[data-t]',m).forEach(x=>x.onclick=async()=>{const t=x.dataset.t;
        if(t==='d'){r.innerHTML='⏳ verbinde mit 142.250.185.78:443 …';await sleep(800);fwEvent(['vela','tcp','142.250.185.78:443','Killswitch-Test']);r.innerHTML='<span style="color:var(--bad)">✕ Blockiert.</span> Ohne Tor kommt keine Verbindung raus.'}
        if(t==='n'){r.innerHTML='⏳ frage 8.8.8.8 …';await sleep(700);fwEvent(['vela','udp','8.8.8.8:53','DNS-Leck-Test']);r.innerHTML='<span style="color:var(--bad)">✕ Blockiert.</span> Niemand im Netzwerk sieht, welche Seiten du besuchst.'}
        if(t==='t'){r.innerHTML='⏳ baue Tor-Kreis auf …';await sleep(1100);const c=newCircuit();r.innerHTML=`<span style="color:var(--ok)">✓ Über Tor:</span> ${c.map(h=>h.f+' '+h.n).join(' → ')} → google.com`}})}
    if(sec==='tor'){m.innerHTML=`<h3>Tor</h3><p class="sub">Verbindung zum Tor-Netzwerk</p>
      <div class="box">${R('Status',SYS.tor?'Bootstrap 100 %':'Verbindet …',SYS.tor?'VERBUNDEN':'…',SYS.tor?'ok':'w')}
      <div class="row"><div>Brücke<small>Nur in Ländern mit Zensur nötig</small></div><select>${['Keine','obfs4','Snowflake','meek-azure'].map(x=>`<option ${x===SYS.bridge?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="row"><div>Neue Tor-Kreise<small>Alle Verbindungen bekommen neue Relays</small></div><button class="btn g" data-nc>Neu aufbauen</button></div></div>`;
      $('select',m).onchange=async e=>{SYS.bridge=e.target.value;SYS.tor=false;updTor();render();await sleep(1500);SYS.tor=true;updTor();emit('tor');render();notify('🧅 Tor neu verbunden','Brücke: '+SYS.bridge)};
      $('[data-nc]',m).onclick=()=>notify('🧅 Neue Tor-Kreise','Alle neuen Verbindungen nutzen andere Relays.')}
    if(sec==='about'){m.innerHTML=`<h3>Über Vela</h3><p class="sub">Vela Secure 1.0 · Tor Edition</p>
      <div class="box">${R('System','Debian 13 „trixie“ · arm64','1.0')}${R('Gerät','Raspberry Pi 3 Model B · BCM2837 · 1 GB RAM','PI 3')}${R('Kernel','6.12 (Debian, gehärtet)','LINUX')}${R('Desktop','labwc (Wayland) · waybar · foot · pcmanfm','WAYLAND')}${R('Browser','Tor Browser 16.0 (ARM64)','STANDARD')}${R('Download-Größe','vela-secure-pi3.img.xz','< 430 MB','w')}</div>
      <div style="display:flex;gap:8px"><button class="btn g" data-r>Testversion zurücksetzen</button></div>`;
      $('[data-r]',m).onclick=()=>{FS=JSON.parse(JSON.stringify(DEFAULT_FS));saveFS();setWall(0);emit('fs');notify('↺ Zurückgesetzt','Dateien und Hintergrund sind wieder wie neu.');render()}}
  }
  const f=()=>{if(sec==='firewall'){const l=$('.fwlog',b);if(l)l.innerHTML=SYS.fwLog.join('<br>');const c=$('.cnt',b);if(c)c.textContent=SYS.fwBlocked}};
  win.cleanup.push(on('fw',f),on('tor',()=>{if(sec==='security'||sec==='tor')render()}));
  win.onArg=s=>{sec=s;render()};render();
}

boot();
</script>
