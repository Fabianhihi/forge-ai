name: Vela Secure – Offline-Installer bauen

# Läuft nur auf dem Zweig "vela-build" – FORGE AI wird nicht berührt.
# Es wird KEIN Release erstellt (FORGE AI nutzt Releases für seine Updates);
# das Ergebnis ist ein Download ("Artifact") am Bau-Lauf.
on:
  push:
    branches: [vela-build]
    paths-ignore: ['.github/workflows/publish.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring parted \
            dosfstools e2fsprogs fdisk xz-utils curl gpg gpgv nftables cpio zerofree

      - name: Vela bauen (Image + Offline-Installer)
        run: sudo ./build.sh

      - name: Offline-Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: vela-offline-installer
          path: |
            vela-installer.run
            Vela installieren.desktop
            installer/ANLEITUNG.txt
          compression-level: 0
          retention-days: 90
